name: Snow Shot Windows Dev Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snow-shot-windows-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installers and portable package
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.tools/vcpkg-binary-cache,readwrite

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select MSVC x64 tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.51"
          # Let vswhere discover VS 2026; this action caps explicit 18.x at 18.9.

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install CMake and NSIS
        run: |
          python -m pip install --disable-pip-version-check cmake==4.2.3 virtualenv
          if ($LASTEXITCODE -ne 0) { throw "CMake/Python helper installation failed." }
          $cmakeBin = python -c "import cmake; print(cmake.CMAKE_BIN_DIR)"
          if ($LASTEXITCODE -ne 0) { throw "Cannot locate the pinned CMake installation." }
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install nsis --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "NSIS installation failed." }
          $nsisBin = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          if (-not (Test-Path -LiteralPath (Join-Path $nsisBin "makensis.exe") -PathType Leaf)) {
            throw "The installed NSIS compiler was not found at $nsisBin."
          }
          $nsisBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate Windows build tools
        id: tools
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($tool in @("git", "cmake", "cpack", "ninja", "cl", "dumpbin", "rc", "cargo", "rustup", "python", "makensis")) {
            $command = Get-Command $tool -ErrorAction Stop
            Write-Output "$tool`: $($command.Source)"
          }
          $cmakeVersion = (& cmake --version | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or $cmakeVersion -ne "cmake version 4.2.3") {
            throw "Expected pinned CMake 4.2.3, found $cmakeVersion."
          }
          if ($env:VCToolsVersion -notmatch '^14\.51\.') { throw "MSVC 14.51 is required." }
          & makensis /VERSION
          if ($LASTEXITCODE -ne 0) { throw "NSIS cannot start." }
          $llvmRoots = @("$env:ProgramFiles\LLVM\bin", "${env:ProgramFiles(x86)}\LLVM\bin")
          $libclang = @($llvmRoots | ForEach-Object {
            Join-Path $_ "libclang.dll"
            Join-Path $_ "clang.dll"
          } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }) | Select-Object -First 1
          if (-not $libclang) { throw "LLVM/libclang for Rust bindgen was not found." }
          "LIBCLANG_PATH=$(Split-Path -Parent $libclang)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerHash = (Get-FileHash -LiteralPath (Get-Command cl).Source -Algorithm SHA256).Hash
          $clangHash = (Get-FileHash -LiteralPath $libclang -Algorithm SHA256).Hash
          $identity = "$env:VCToolsVersion|$env:WindowsSDKVersion|$cmakeVersion|$compilerHash|$clangHash"
          $fingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($identity))).ToLowerInvariant()
          "cache-key=$fingerprint" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "Toolchain: $identity"

      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: .tools/vcpkg-binary-cache
          key: snow-vcpkg-static-v1-${{ steps.tools.outputs.cache-key }}-${{ hashFiles('scripts/bootstrap.ps1', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'cmake/vcpkg-msvc-145-14.51-toolchain.cmake') }}
          restore-keys: |
            snow-vcpkg-static-v1-${{ steps.tools.outputs.cache-key }}-

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-static-${{ steps.tools.outputs.cache-key }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**', 'cmake/vcpkg-msvc-145-14.51-toolchain.cmake') }}
          workspaces: |
            snow-crates -> ../build/snow-shot-msvc-release/cargo
            snow_draw_engine_qt -> ../build/snow-shot-msvc-release/cargo
            snow_rust_ffi -> ../build/snow-shot-msvc-release/cargo
            snow_shot/rust/snow-shot-updater -> ../../../build/snow-shot-msvc-release/cargo
          cache-on-failure: true

      - name: Install Windows static dependencies
        id: dependencies
        run: .\scripts\bootstrap.ps1 -VcpkgVariants Static -SkipQtValidation

      # Persist expensive dependencies before Qt or application packaging can fail.
      - name: Save vcpkg binary packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .tools/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save partial vcpkg packages after dependency failure
        if: ${{ !cancelled() && steps.dependencies.outcome == 'failure' }}
        uses: actions/cache/save@v5
        with:
          path: .tools/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Restore static Qt kit
        id: qt-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.tool_cache }}\snow-qt\6.11.1\msvc2026_64-static-system-codecs
          key: snow-qt-static-v3-6.11.1-${{ steps.tools.outputs.cache-key }}-${{ hashFiles('scripts/build-static-qt.ps1', '.tools/vcpkg/installed/static/x64-windows-static/share/zlib/vcpkg_abi_info.txt', '.tools/vcpkg/installed/static/x64-windows-static/share/libpng/vcpkg_abi_info.txt') }}

      - name: Prepare static Qt 6.11.1
        run: |
          $prefix = Join-Path $env:RUNNER_TOOL_CACHE "snow-qt\6.11.1\msvc2026_64-static-system-codecs"
          $dependencies = Join-Path $env:GITHUB_WORKSPACE ".tools\vcpkg\installed\static\x64-windows-static"
          & "$env:GITHUB_WORKSPACE\scripts\build-static-qt.ps1" -QtVersion 6.11.1 -InstallPrefix $prefix -DependencyPrefix $dependencies
          if ($LASTEXITCODE -ne 0) { throw "Static Qt bootstrap failed." }
          $qtDir = Join-Path $prefix "lib\cmake\Qt6"
          if (-not (Test-Path -LiteralPath (Join-Path $qtDir "Qt6Config.cmake"))) {
            throw "Qt 6.11.1 static CMake package was not found at $qtDir"
          }
          "SNOW_QT_STATIC_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Qt6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Save static Qt kit
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.tool_cache }}\snow-qt\6.11.1\msvc2026_64-static-system-codecs
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}

      - name: Build and package Windows artifacts
        run: .\scripts\stage-snow-shot-release.ps1 -Parallelism 4

      - name: Verify downloadable packages
        run: |
          $ErrorActionPreference = "Stop"
          $version = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'set\(SNOW_SHOT_VERSION "([^"]+)"\)').Groups[1].Value
          if (-not $version) { throw "Snow Shot version was not found." }
          foreach ($variant in @("online", "offline", "portable")) {
            $extension = if ($variant -eq "portable") { "zip" } else { "exe" }
            $base = "build/snow-shot-msvc-release/snow-shot-$version-windows-x64-$variant"
            $package = Get-Item -LiteralPath "$base.$extension" -ErrorAction Stop
            if ($package.Length -eq 0) { throw "Empty package: $($package.Name)" }
            $expectedHash = ((Get-Content -LiteralPath "$base.$extension.sha256" -Raw) -split '\s+')[0]
            $actualHash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash
            if ($actualHash -ine $expectedHash) { throw "Package checksum mismatch: $($package.Name)" }
            Get-Item -LiteralPath "$base.manifest.json" -ErrorAction Stop | Out-Null
          }

      - name: Upload installers and portable package
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-windows-dev-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-online.exe
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-online.exe.sha256
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-online.manifest.json
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-offline.exe
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-offline.exe.sha256
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-offline.manifest.json
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-portable.zip
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-portable.zip.sha256
            build/snow-shot-msvc-release/snow-shot-*-windows-x64-portable.manifest.json

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-windows-dev-logs-${{ github.run_number }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            .tools/vcpkg/buildtrees/**/*.log
            build/**/CMakeCache.txt
            build/**/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/qt-build-6.11.1-static-system-codecs-release/CMakeCache.txt
            ${{ runner.temp }}/qt-build-6.11.1-static-system-codecs-release/CMakeFiles/CMakeConfigureLog.yaml
